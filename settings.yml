accent_color:
  type: string
  default: "#172D72"
  description: "Main brand accent hex (links, active nav, highlights) — tuyaopen.ai navy."
banner_gradient_start:
  type: string
  default: "#10A6FA"
  description: "Left side of the welcome banner gradient (hex)."
banner_gradient_end:
  type: string
  default: "#172D72"
  description: "Right side of the welcome banner gradient (hex)."
active_pill_color:
  type: string
  default: "#172D72"
  description: "Background hex of the active navigation pill (Latest/Top)."

header_logo_url:
  type: string
  default: "https://tuyaopen.ai/img/home/tuyaopen-logo-simple-dark.png"
  description: "Header logo image (bundled tuyaopen.ai logo by default; swap for any URL or upload)."

header_logo_link:
  type: string
  default: "https://tuyaopen.ai/"
  description: "Where the header logo links on click (tuyaopen.ai by default; use / for the forum home)."

github_repo_url:
  type: string
  default: "https://github.com/tuya/TuyaOpen"
  description: "GitHub icon link in the header (main repo). Leave empty to hide the icon."

welcome_banner_enabled:
  type: bool
  default: true
  description: "Show the gradient welcome banner above the topic list."
welcome_banner_title:
  type: string
  default: '{"en":"Welcome to the TuyaOpen Forum!","zh":"欢迎来到 TuyaOpen 论坛！"}'
  description: "Banner heading. Plain text, or a JSON object with per-locale texts, e.g. {\"en\":\"...\",\"zh\":\"...\"}."
welcome_banner_search_placeholder:
  type: string
  default: '{"en":"Search the forum…","zh":"搜索论坛…"}'
  description: "Banner search input placeholder. Plain text or per-locale JSON object."
welcome_banner_search_button:
  type: string
  default: '{"en":"Search","zh":"搜索"}'
  description: "Banner search button text. Plain text or per-locale JSON object."
welcome_banner_search_enabled:
  type: bool
  default: false
  description: "Show a search box inside the welcome banner (off by default — Discourse already greets users and offers search)."

hero_tagline:
  type: string
  default: '{"en":"An open-source AI+IoT framework for building next-gen smart hardware","zh":"面向下一代智能硬件的开源 AI+IoT 开发框架"}'
  description: "Tagline shown under the banner title. Plain text or per-locale JSON object; leave empty to hide."
hero_cta_text:
  type: string
  default: '{"en":"Get Started","zh":"快速开始"}'
  description: "Primary call-to-action button text in the banner."
hero_cta_url:
  type: string
  default: "/docs/about-tuyaopen"
  description: "Primary call-to-action destination (relative paths resolve to tuyaopen.ai)."
hero_cta_secondary_text:
  type: string
  default: '{"en":"View on GitHub","zh":"GitHub 仓库"}'
  description: "Secondary call-to-action button text (links to github_repo_url)."

footer_enabled:
  type: bool
  default: true
  description: "Show the custom TuyaOpen footer above the Discourse footer."
footer_tagline:
  type: string
  default: '{"en":"Open-source AI, OS and platform for IoT development","zh":"面向物联网开发的开源 AI、系统与平台"}'
  description: "Footer brand tagline. Plain text or per-locale JSON object."
footer_copyright:
  type: string
  default: '{"en":"© {year} TuyaOpen Community. All rights reserved.","zh":"© {year} TuyaOpen 社区 · 保留所有权利"}'
  description: "Footer copyright line. {year} is replaced automatically."

ide_promo_enabled:
  type: bool
  default: true
  description: "Show the TuyaOpen IDE marketing section below the topic list on the Latest page."
ide_promo_badge:
  type: string
  default: '{"en":"✨ New · Early Preview","zh":"✨ 新品 · 抢先预览"}'
  description: "Small badge above the promo title."
ide_promo_title:
  type: string
  default: '{"en":"Build Hardware with TuyaOpen IDE","zh":"用 TuyaOpen IDE 打造硬件产品"}'
  description: "Promo section title."
ide_promo_slogan:
  type: string
  default: '{"en":"Vibe Coding your next Agentic Hardware","zh":"Vibe Coding 你的下一代智能体硬件"}'
  description: "Highlighted slogan under the title."
ide_promo_description:
  type: string
  default: '{"en":"The full-stack hardware development tool for the AI era — from project creation to device firmware, cloud agent, and app development. Three surfaces, one workflow.","zh":"面向 AI 时代的全栈硬件开发工具 — 从项目创建到设备固件、云端智能体与应用开发，三位一体，一气呵成。"}'
  description: "Short description paragraph."
ide_promo_image:
  type: string
  default: "https://tuyaopen.ai/img/ide/coding-agent.png"
  description: "Promo image URL shown in the media column. Leave empty to hide."
ide_promo_cta_text:
  type: string
  default: '{"en":"Install Extension","zh":"安装扩展"}'
  description: "Primary CTA button text."
ide_promo_cta_url:
  type: string
  default: "/tuyaopen-ide"
  description: "Primary CTA destination (relative paths resolve to tuyaopen.ai)."
ide_promo_secondary_text:
  type: string
  default: '{"en":"View on GitHub","zh":"GitHub 仓库"}'
  description: "Secondary CTA button text (links to github_repo_url)."

